<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>AI Translator settings</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>AI Translator</h1>
      <p class="hint">Select text in any input field, click the translate icon, and pick a language.</p>

      <section>
        <h2><label for="provider">Translation provider</label></h2>
        <select id="provider"></select>
      </section>

      <section>
        <h2>Favorite languages</h2>
        <p class="hint">These appear in the in-page menu.</p>
        <div id="languages" class="languages"></div>
      </section>

      <footer>
        <button id="save" type="button">Save</button>
        <span id="status" role="status"></span>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
