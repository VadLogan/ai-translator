<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AI Translator playground</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
      label { display: block; margin-top: 20px; font-weight: 600; }
      input, textarea, [contenteditable] { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; border: 1px solid #ccc; border-radius: 6px; }
      textarea { height: 80px; }
    </style>
  </head>
  <body>
    <h1>AI Translator playground</h1>
    <p>Select some text in a field below. The translate icon should appear. Plain text like this paragraph gets it too, translated into a panel to copy.</p>
    <label for="input">Text input</label>
    <input id="input" value="Hello, how are you today?" />
    <label for="textarea">Textarea</label>
    <textarea id="textarea">I would like to order a coffee, please.</textarea>
    <label>Contenteditable</label>
    <div id="editor" contenteditable="true">Good morning, dear colleagues.</div>
    <label for="password">Password (ignored)</label>
    <input id="password" type="password" value="secret" />
    <h2>Login form (all ignored)</h2>
    <label for="username">Username</label>
    <input id="username" name="username" value="john.doe" />
    <label for="email">Email</label>
    <input id="email" autocomplete="email" value="john@example.com" />
    <label for="otp">One-time code</label>
    <input id="otp" autocomplete="one-time-code" value="123456" />
    <label for="opted-out">Opted out (data-ai-translator="off")</label>
    <textarea id="opted-out" data-ai-translator="off">This page asked us to stay out.</textarea>
  </body>
</html>
